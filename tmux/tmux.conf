unbind r
bind r source-file ~/.config/tmux/tmux.conf \; display-message "Config reloaded!"

bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

bind-key C-o popup -E -d "#{pane_current_path}" -w 90% -h 90% "opencode"

bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# open a terminal in the current directory
bind-key C-p display-popup -w 85% -h 85% -E "tmux attach-session -t popup || tmux new-session -s popup"
bind C-n display-popup -E 'bash -i -c "read -p \"Session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'

# switch to a different session using fzf and open in a popup
bind C-t display-popup -w 85% -h 85% -E "tmux attach-session -t $(tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse)" 

bind C-b display-popup -E "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"
# bind C-t display-popup \
#   -d "#{pane_current_path}" \
#   -w 75% \
#   -h 75% \
#   -E "zsh"

# bind -n Z "resize-pane -Z"

set -g default-terminal "tmux-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

set -g base-index 1
setw -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on
set-option -g status-position top
set -g mouse on
setw -g mode-keys vi
set -s set-clipboard on
set -s escape-time 0

# Configure the catppuccin plugin
set -g @catppuccin_flavor "mocha"
set -g @catppuccin_window_status_style "rounded"

# Load catppuccin
run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# Some basic mocha colors.
set -g @ctp_bg "#24273a"
set -g @ctp_surface_1 "#494d64"
set -g @ctp_fg "#cad3f5"
set -g @ctp_mauve "#c6a0f6"
set -g @ctp_crust "#181926"

# Make the status line pretty and add some modules
set -g status-left "#{E:@catppuccin_status_session}"
set -gF status-style "bg=#{@ctp_bg},fg=#{@ctp_fg}"
set -g window-status-current-format "#[bg=#{@ctp_mauve},fg=#{@ctp_crust}] #I • #{E:@_ctp_w_text_style} #{pane_current_path} "
set -g window-status-format "#{E:@_ctp_w_number_style} #I • #{E:@_ctp_w_text_style} #{pane_current_path} "
set -g status-right-length 100
set -g status-left-length 100
set -g status-right "#{E:@catppuccin_status_application}"
set -agF status-right "#{E:@catppuccin_status_cpu}"
# set -ag status-right "#{E:@catppuccin_status_session}"
set -ag status-right "#{E:@catppuccin_status_uptime}"
set -agF status-right "#{E:@catppuccin_status_battery}"

# I recommend using `o` if not already in use, for least key strokes when launching

# set -g @plugin 'catppuccin/tmux'
set -g @plugin 'tmux-plugins/tmux-battery'
set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tpm'


run '~/.tmux/plugins/tpm/tpm'
