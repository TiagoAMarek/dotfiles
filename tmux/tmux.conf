# ~/.tmux.conf (Final version with Ctrl-b prefix)

# -----------------------------------------------------------------------------
# -- General Settings ---------------------------------------------------------
# -----------------------------------------------------------------------------

# Set the prefix key to C-a (the default)
set-option -g prefix C-a

# Set terminal to 24-bit (true color) mode for modern terminals like Ghostty
# set -g default-terminal "tmux-24bit"
set-option -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm*:Tc"

# Enable mouse support for scrolling, pane selection, and resizing
set -g mouse on

set-window-option -g automatic-rename on

# Start window and pane numbering at 1, not 0
set -g base-index 1
setw -g pane-base-index 1
set-option -g renumber-windows on

# Set a longer history limit
set -g history-limit 50000

# Set escape time to 0 for faster key responsiveness (e.g., in Neovim)
set -s escape-time 0

# Enable focus events for applications like Neovim
set -g focus-events on

# Set status bar position to the top
set-option -g status-position top

# set shell
set -g default-shell /bin/zsh


# -----------------------------------------------------------------------------
# -- Keybindings --------------------------------------------------------------
# -----------------------------------------------------------------------------

# Reload config file with Prefix + r (pointing to the new path)
bind r source-file ~/.config/tmux/tmux.conf \; display "Config reloaded!"

# Split panes using | and \ , keeping the current path
bind | split-window -h -c "#{pane_current_path}"
bind \\ split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# Pane navigation with vim-style keys (h, j, k, l)
# These work seamlessly with the 'christoomey/vim-tmux-navigator' plugin
# for unified navigation between tmux panes and Vim/Neovim splits
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Resize panes with Vim-style keys (using Shift)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# List sessions
bind -n M-q choose-session

# List sessions
bind -n M-w choose-window

# Maximize the current pane with Prefix + z (zoom)
bind -n M-Z 'resize-pane -Z'

# Resize current pane to 80% of screen width and height
bind -n M-9 resize-pane -x 80% -y 80%

# Equalize all pane widths
bind -n M-0 select-layout even-horizontal

# previous window shortcut
bind -n M-p previous-window

# next window shortcut
bind -n M-n next-window


bind C-d switch -t tmux-config
bind C-z switch -t zeno
bind C-x switch -t brxm

# -- Advanced fzf Popup Bindings --
# Note: C-b is now the prefix, so the fzf session switcher is bound to Prefix + s
bind C-b display-popup -w 80% -h 80% -E \
  "tmux list-sessions | sed -E 's/:.*$//' | grep -v \"^$(tmux display-message -p '#S')\$\" | fzf --reverse | xargs tmux switch-client -t"

# Create a new session with a name prompt in a popup
bind C-n display-popup -w 80% -h 80% -E \
  'bash -i -c "read -p \"New session name: \" name; tmux new-session -d -s \$name && tmux switch-client -t \$name"'

# -----------------------------------------------------------------------------
# -- Plugin Manager (TPM) -----------------------------------------------------
# -----------------------------------------------------------------------------
# For TPM to work, you must install it first.
# Git: git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm

set -g @plugin 'tmux-plugins/tpm'

# -- My recommended plugins --
set -g @plugin 'tmux-plugins/tmux-resurrect'     # Persists tmux environment across reboots
set -g @plugin 'tmux-plugins/tmux-continuum'     # Continuously saves sessions
set -g @plugin 'tmux-plugins/tmux-yank'          # For macOS clipboard integration

# run ~/.config/tmux/plugins/catppuccin/tmux/catppuccin.tmux

# -- Plugins from your config --
set -g @plugin 'niksingh710/minimal-tmux-status'
# set -g @plugin 'tmux-plugins/tmux-battery'
# set -g @plugin 'tmux-plugins/tmux-cpu'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'IngoMeyer441/tmux-easy-motion'

# Tmux easymotion
set -g @easy-motion-prefix 'e'

# Tmux Menu settings
set -g @menus_without_prefix 'Yes'
set -g @menus_trigger 'M-h'

# Resurrect settings
set -g @resurrect-capture-pane-contents 'on' # Restore pane contents (e.g., vim sessions)
set -g @continuum-restore 'on'               # Automatically restore last session on startup

# Initialize TPM (keep this line at the very bottom of your .tmux.conf)
run '~/.tmux/plugins/tpm/tpm'
